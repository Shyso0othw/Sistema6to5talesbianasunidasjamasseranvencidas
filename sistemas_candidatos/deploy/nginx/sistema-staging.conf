# TEMPLATE: replace PRIVATE_BIND_IP and LAN_CIDR before nginx -t.
# Bind only to a private interface; no port forwarding from the Internet.
server {
    listen PRIVATE_BIND_IP:80;
    server_name srv-app01;
    allow 127.0.0.1;
    allow LAN_CIDR;
    allow 100.64.0.0/10;
    deny all;
    include /etc/nginx/snippets/sistema-common.conf;
}
