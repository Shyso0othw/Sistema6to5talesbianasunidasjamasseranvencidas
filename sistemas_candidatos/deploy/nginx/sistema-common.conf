# Include inside the server block. Do not expose backend source, media or environment.
root /srv/sistema-escolar/frontend/dist;
index index.html;
client_max_body_size 10m;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
}
location /ws/ {
    access_log off; # JWT query parameter must not be stored in access logs.
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 75s;
}
location /static/ { alias /srv/sistema-escolar/backend/backend/staticfiles/; }
location /media/ { return 403; }
location ~ /\. { deny all; }
location = /index.html { add_header Cache-Control "no-cache"; }
location / { try_files $uri $uri/ /index.html; }
