# TEMPLATE: replace DOMAIN and certificate paths after DNS/TLS provisioning.
server {
    listen 80;
    server_name DOMAIN;
    return 301 https://DOMAIN$request_uri;
}
server {
    listen 443 ssl;
    server_name DOMAIN;
    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/snippets/sistema-common.conf;
}
